[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-rag"
version = "0.1.0"
description = "Testing and development harness for Deep Agents enhanced with RAG capabilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Agent Harness RAG Contributors"}
]
keywords = ["rag", "agents", "langchain", "langgraph", "deep-agents", "retrieval", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "langchain>=1.0.8",
    "langchain-core>=1.1.0",
    "langchain-openai>=1.0.1",
    "langchain-chroma>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.3",
    "langgraph-cli>=0.4.7",
    "langgraph-api>=0.5.26",
    "langgraph-checkpoint>=3.0.1",
    "langgraph-prebuilt>=1.0.5",
    "langgraph-runtime-inmem>=0.19.0",
    "langgraph-sdk>=0.2.9",
    "deepagents>=0.2.8",
    "chromadb>=1.3.5",
    "rank-bm25>=0.2.2",
    "openai>=2.6.0",
    "python-dotenv>=1.1.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ipython>=9.4.0",
    "jupyter-client>=8.6.3"
]
monitoring = [
    "langsmith>=0.4.37"
]

[project.urls]
Homepage = "https://github.com/bhargav-latent/Agent-Harness-RAG"
Repository = "https://github.com/bhargav-latent/Agent-Harness-RAG"
Issues = "https://github.com/bhargav-latent/Agent-Harness-RAG/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "scripts*", "evaluation*"]
exclude = ["tests*", "docs*", "rag_data*", "chroma_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | chroma_db
  | rag_data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
extend_skip_glob = ["chroma_db/*", "rag_data/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["chroma_db", "rag_data", "tests"]
